<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #fff; }
  </style>
</head>
<body>
  <form id="checkoutForm" method="POST" style="display:none;"></form>

  <script>
    function bridgeSend(type, data) {
      var payload = JSON.stringify({ type: type, data: data });
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler('BushaPayBridge', payload);
      }
    }

    // Listen for postMessage from the checkout page after form navigation.
    // The checkout page sends INITIALIZED, CANCELLED, COMPLETED statuses.
    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || typeof data !== 'object') return;

      var status = data.status;
      if (status === 'INITIALIZED') {
        bridgeSend('ready', {});
      } else if (status === 'CANCELLED') {
        bridgeSend('close', data.data || {});
      } else if (status === 'COMPLETED') {
        bridgeSend('success', data);
      }
    });

    // Called by Flutter to populate and submit the form.
    function initCheckout(config) {
      var form = document.getElementById('checkoutForm');
      form.action = config._checkoutUrl;

      // Remove the internal field before iterating
      delete config._checkoutUrl;

      // Create hidden inputs for each field
      for (var key in config) {
        if (config.hasOwnProperty(key)) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = config[key];
          form.appendChild(input);
        }
      }

      form.submit();
    }
  </script>
</body>
</html>
