name: Release

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK to release ("all" releases every SDK at once)'
        required: true
        type: choice
        options:
          - flutter
          - android
          - ios
          - react-native
          - all
      version:
        description: 'Version (e.g. 1.0.0). Leave empty to auto-bump from conventional commits.'
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.sdk }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag prefix
        id: prefix
        if: inputs.version == ''
        run: |
          SDK='${{ inputs.sdk }}'
          if [ "$SDK" = "all" ]; then
            PREFIX="v"
            FALLBACK="v0.0.1"
          elif git tag --list "${SDK}/v*" | grep -q .; then
            PREFIX="${SDK}/v"
            FALLBACK="${SDK}/v0.0.1"
          else
            PREFIX="v"
            FALLBACK="v0.0.1"
          fi
          echo "prefix=${PREFIX}"     >> $GITHUB_OUTPUT
          echo "fallback=${FALLBACK}" >> $GITHUB_OUTPUT
          echo "Using prefix=${PREFIX} fallback=${FALLBACK}"

      - name: Auto-bump version
        id: semver
        if: inputs.version == ''
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: ${{ github.ref_name }}
          prefix: ${{ steps.prefix.outputs.prefix }}
          patchList: fix, bugfix, perf, refactor, test, tests, chore
          fallbackTag: ${{ steps.prefix.outputs.fallback }}

      - name: Resolve version + tag
        id: out
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ steps.semver.outputs.nextStrict }}"
          fi

          # Strip any 'sdk/' prefix the semver-action leaks when its tag
          # prefix contains a slash, then any leading 'v'.
          VERSION="${VERSION##*/}"
          VERSION="${VERSION#v}"
          # Sanity check: must be a valid SemVer-ish string.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::Resolved version '${VERSION}' is not a valid SemVer"
            exit 1
          fi
          if [ "${{ inputs.sdk }}" = "all" ]; then
            TAG="v${VERSION}"
          else
            TAG="${{ inputs.sdk }}/v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"
          echo "Resolved tag:     ${TAG}"

  build-flutter:
    name: Build Flutter
    needs: version
    if: inputs.sdk == 'flutter' || inputs.sdk == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Sync shared assets
        run: make sync-flutter

      - name: Bump flutter/pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ needs.version.outputs.version }}/" flutter/pubspec.yaml
          grep '^version:' flutter/pubspec.yaml

      - name: Build Flutter
        run: make build-flutter

      - name: Package zip
        run: |
          mkdir -p release
          rsync -a \
            --exclude='.dart_tool' \
            --exclude='.flutter-plugins-dependencies' \
            --exclude='build' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='*.iml' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            flutter/ release/busha_pay_flutter/
          (cd release && zip -rq "busha_pay_flutter-${{ needs.version.outputs.version }}.zip" busha_pay_flutter)

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: busha_pay_flutter
          path: release/busha_pay_flutter-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: version
    if: inputs.sdk == 'android' || inputs.sdk == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Sync shared assets
        run: make sync-android

      - name: Bump android/gradle.properties
        run: |
          sed -i "s/^VERSION=.*/VERSION=${{ needs.version.outputs.version }}/" android/gradle.properties
          grep '^VERSION=' android/gradle.properties

      # Verifies the library builds at the release version. The artifact
      # itself is distributed via the JitPack mirror (see mirror-android).
      - name: Build release AAR
        working-directory: android
        run: ./gradlew :pay-android:assembleRelease

  build-react-native:
    name: Build React Native
    needs: version
    if: inputs.sdk == 'react-native' || inputs.sdk == 'all'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: react-native/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Sync shared assets
        working-directory: ${{ github.workspace }}
        run: make sync-rn

      - name: Bump react-native/package.json
        run: |
          npm pkg set version=${{ needs.version.outputs.version }}
          grep '"version"' package.json | head -1

      - name: Build library
        run: |
          yarn install --immutable
          yarn prepare

      - name: Pack library
        run: |
          mkdir -p "${{ github.workspace }}/release"
          yarn pack --out "${{ github.workspace }}/release/busha_pay_react_native-${{ needs.version.outputs.version }}.tgz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: busha_pay_react_native
          path: release/busha_pay_react_native-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error

  commit-bumps:
    name: Commit version bumps + CHANGELOG
    needs: [version, build-flutter, build-android, build-react-native]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.build-flutter.result != 'failure' && needs.build-flutter.result != 'cancelled' &&
      needs.build-android.result != 'failure' && needs.build-android.result != 'cancelled' &&
      needs.build-react-native.result != 'failure' && needs.build-react-native.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref_name }}

      - name: Bump flutter/pubspec.yaml
        if: inputs.sdk == 'flutter' || inputs.sdk == 'all'
        run: |
          sed -i "s/^version: .*/version: ${{ needs.version.outputs.version }}/" flutter/pubspec.yaml
          grep '^version:' flutter/pubspec.yaml

      - name: Bump react-native/package.json
        if: inputs.sdk == 'react-native' || inputs.sdk == 'all'
        working-directory: react-native
        run: |
          npm pkg set version=${{ needs.version.outputs.version }}
          grep '"version"' package.json | head -1

      - name: Bump android/gradle.properties
        if: inputs.sdk == 'android' || inputs.sdk == 'all'
        run: |
          sed -i "s/^VERSION=.*/VERSION=${{ needs.version.outputs.version }}/" android/gradle.properties
          grep '^VERSION=' android/gradle.properties

      - name: Update SDK CHANGELOG(s)
        run: |
          set -euo pipefail
          VERSION='${{ needs.version.outputs.version }}'
          DATE=$(date -u +%Y-%m-%d)

          update_sdk_changelog() {
            local sdk=$1
            local dir=$2
            local changelog="${dir}/CHANGELOG.md"
            local prev_tag
            prev_tag=$(git tag --list "${sdk}/v*" --sort=-v:refname \
              | grep -v "^${sdk}/v${VERSION}$" \
              | head -1 || true)
            local range
            if [ -n "$prev_tag" ]; then
              range="${prev_tag}..HEAD"
            else
              range="HEAD"
            fi
            local commits
            commits=$(git log "$range" --pretty='- %s (%h)' \
              --invert-grep -E --grep '^(ci|build)(\(|:)' \
              -- "${dir}/" 'shared/' || true)
            [ -z "$commits" ] && commits='- No notable changes.'
            local tmp
            tmp=$(mktemp)
            {
              printf '## %s - %s\n\n' "$VERSION" "$DATE"
              printf '%s\n\n' "$commits"
              if [ -f "$changelog" ]; then
                awk -v v="$VERSION" '
                  $0 ~ "^## " v "( |$)" { skip=1; next }
                  skip && /^## / { skip=0 }
                  !skip { print }
                ' "$changelog"
              fi
            } > "$tmp"
            mv "$tmp" "$changelog"
            echo "--- updated $changelog ---"
            head -20 "$changelog"
            echo
          }

          case '${{ inputs.sdk }}' in
            flutter)       update_sdk_changelog flutter flutter ;;
            android)       update_sdk_changelog android android ;;
            ios)           update_sdk_changelog ios ios ;;
            react-native)  update_sdk_changelog react-native react-native ;;
            all)
              update_sdk_changelog flutter flutter
              update_sdk_changelog react-native react-native
              update_sdk_changelog android android
              # TODO: add ios once that SDK's CHANGELOG is wired in.
              ;;
          esac

      - name: Commit bumps + CHANGELOG
        run: |
          set -euo pipefail
          for f in flutter/pubspec.yaml flutter/CHANGELOG.md \
                   react-native/package.json react-native/CHANGELOG.md \
                   android/gradle.properties android/CHANGELOG.md ios/CHANGELOG.md; do
            [ -f "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit — manifests + CHANGELOG already up to date."
            exit 0
          fi
          echo '--- staged ---'
          git diff --cached --name-only
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build(release): ${{ needs.version.outputs.tag }} [skip ci]'
          git push origin HEAD:${{ github.ref_name }}

  package:
    name: Create GitHub release
    needs: [version, commit-bumps]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.commit-bumps.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release artifacts
        run: ls -la release/ || true

      - name: Verify RELEASE_PAT is set
        env:
          TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PAT is empty — without it the tag is created with GITHUB_TOKEN, which suppresses downstream workflows."
            exit 1
          fi
          echo "RELEASE_PAT length=${#TOKEN}"

      - name: Create + push tag
        run: |
          set -euo pipefail
          TAG='${{ needs.version.outputs.tag }}'
          git fetch --tags origin
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on remote — skipping push."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag "$TAG"
          git push origin "$TAG"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.RELEASE_PAT }}
          tag: ${{ needs.version.outputs.tag }}
          generateReleaseNotes: true
          artifacts: release/*.zip,release/*.tgz
          allowUpdates: true

      - name: Mirror tag to each SDK
        if: inputs.sdk == 'all'
        run: |
          VERSION='${{ needs.version.outputs.version }}'
          ALL_TAG='${{ needs.version.outputs.tag }}'
          git fetch --tags origin
          for sdk in flutter react-native android ios; do
            SDK_TAG="${sdk}/v${VERSION}"
            if git ls-remote --tags origin "refs/tags/${SDK_TAG}" | grep -q .; then
              echo "Skipping ${SDK_TAG} — already exists on remote"
              continue
            fi
            git tag "$SDK_TAG" "$ALL_TAG"
            git push origin "$SDK_TAG"
            echo "Created ${SDK_TAG} -> ${ALL_TAG}"
          done

      - name: Dispatch pub.dev publish (Flutter)
        if: inputs.sdk == 'flutter' || inputs.sdk == 'all'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          TAG='flutter/v${{ needs.version.outputs.version }}'
          echo "Dispatching publish-flutter.yml on $TAG"
          gh workflow run publish-flutter.yml --ref "$TAG" -f tag="$TAG"

  mirror-ios:
    name: Mirror iOS package to bushaHQ/pay-ios
    needs: [version, package]
    if: |
      always() &&
      needs.package.result == 'success' &&
      (inputs.sdk == 'ios' || inputs.sdk == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install librsvg (rsvg-convert for SVG → PDF in make sync)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Sync shared assets
        run: make sync-ios

      - name: Push snapshot to bushaHQ/pay-ios
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          cd ios
          git init -q -b dev
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m "iOS SDK v${VERSION}"
          git remote add mirror "https://x-access-token:${TOKEN}@github.com/bushaHQ/pay-ios.git"
          if git ls-remote --tags mirror "refs/tags/v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already exists on bushaHQ/pay-ios — skipping."
            exit 0
          fi
          git push --force mirror dev
          git tag "v${VERSION}"
          git push mirror "v${VERSION}"
          echo "Mirrored bushaHQ/pay-ios @ v${VERSION}"

  mirror-android:
    name: Mirror Android library to bushaHQ/pay-android
    needs: [version, package]
    if: |
      always() &&
      needs.package.result == 'success' &&
      (inputs.sdk == 'android' || inputs.sdk == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Sync shared assets
        run: make sync-android

      # Pushes the android/ directory verbatim to the standalone mirror
      # repo. JitPack builds the library from the pushed tag on demand —
      # consumers resolve com.github.bushaHQ.pay-android:pay-android:<tag>.
      - name: Push snapshot to bushaHQ/pay-android
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          cd android
          git init -q -b main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m "Android SDK ${VERSION}"
          git remote add mirror "https://x-access-token:${TOKEN}@github.com/bushaHQ/pay-android.git"
          if git ls-remote --tags mirror "refs/tags/${VERSION}" | grep -q .; then
            echo "Tag ${VERSION} already exists on bushaHQ/pay-android — skipping."
            exit 0
          fi
          git push --force mirror main
          git tag "${VERSION}"
          git push mirror "${VERSION}"
          echo "Mirrored bushaHQ/pay-android @ ${VERSION}"
