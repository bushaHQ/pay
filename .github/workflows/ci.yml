name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      react-native: ${{ steps.filter.outputs.react-native }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'flutter/**'
              - 'shared/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'shared/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - 'shared/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            react-native:
              - 'react-native/**'
              - 'shared/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  flutter:
    name: Flutter
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Sync shared assets
        run: make sync-flutter
        working-directory: ${{ github.workspace }}

      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage

      - name: Enforce minimum coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: flutter/coverage/lcov.info
          min_coverage: 70

      - name: Extract coverage percentage
        id: coverage
        run: |
          sudo apt-get install -y lcov > /dev/null 2>&1
          PCT=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | sed 's/.*: \([0-9.]*\)%.*/\1/')
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
          echo "Flutter coverage: $PCT%"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          PCT="${{ steps.coverage.outputs.percentage }}"
          if (( $(echo "$PCT >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          printf '{"schemaVersion":1,"label":"flutter coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > flutter/coverage-badge.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/coverage-badge.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update flutter coverage badge [skip ci]"
            git stash --include-untracked || true
            git pull --rebase
            git stash pop || true
            git push
          fi

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Android SDK not yet implemented — skipping."

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      IOS_BUILD_DESTINATION: generic/platform=iOS Simulator
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest
    steps:
      - uses: actions/checkout@v6

      - name: Install librsvg (rsvg-convert for SVG → PDF in make sync-ios)
        run: brew install librsvg

      - name: Sync shared assets
        run: make sync-ios

      - name: Build
        working-directory: ios
        run: |
          xcodebuild \
            -scheme BushaPay \
            -destination "$IOS_BUILD_DESTINATION" \
            build

      - name: Test (with coverage)
        working-directory: ios
        run: |
          xcodebuild \
            -scheme BushaPay \
            -destination "$IOS_TEST_DESTINATION" \
            -enableCodeCoverage YES \
            -derivedDataPath build/derivedData \
            test

      - name: Extract coverage percentage
        id: coverage
        working-directory: ios
        run: |
          XCRESULT=$(find build/derivedData -name '*.xcresult' | head -1)
          if [ -z "$XCRESULT" ]; then
            echo "No .xcresult bundle found under build/derivedData" >&2
            exit 1
          fi
          # Pull the BushaPay product target's line coverage. We match the
          # target name exactly so the BushaPayTests bundle doesn't inflate
          # the number.
          PCT=$(xcrun xccov view --report --json "$XCRESULT" \
            | jq -r '.targets[] | select(.name == "BushaPay") | .lineCoverage * 100' \
            | xargs printf '%.2f')
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
          echo "iOS coverage: $PCT%"

      - name: Enforce minimum coverage
        run: |
          PCT="${{ steps.coverage.outputs.percentage }}"
          MIN=50
          if (( $(echo "$PCT < $MIN" | bc -l) )); then
            echo "iOS coverage $PCT% is below minimum $MIN%"
            exit 1
          fi
          echo "iOS coverage $PCT% meets minimum $MIN%"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          PCT="${{ steps.coverage.outputs.percentage }}"
          if (( $(echo "$PCT >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          printf '{"schemaVersion":1,"label":"ios coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > ios/coverage-badge.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/coverage-badge.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update ios coverage badge [skip ci]"
            git stash --include-untracked || true
            git pull --rebase
            git stash pop || true
            git push
          fi

  react-native:
    name: React Native
    needs: changes
    if: needs.changes.outputs.react-native == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: react-native
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: react-native/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Sync shared HTML
        working-directory: ${{ github.workspace }}
        run: make sync-rn

      - name: Restore dependencies
        id: yarn-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: |
            react-native/**/node_modules
            react-native/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('react-native/yarn.lock') }}-${{ hashFiles('react-native/**/package.json', '!react-native/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ hashFiles('react-native/yarn.lock') }}
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Save dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: |
            react-native/**/node_modules
            react-native/.yarn/install-state.gz
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test (with coverage)
        run: yarn test:coverage

      - name: Enforce minimum coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: react-native/coverage/lcov.info
          min_coverage: 70

      - name: Extract coverage percentage
        id: coverage
        run: |
          sudo apt-get install -y lcov > /dev/null 2>&1
          PCT=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | sed 's/.*: \([0-9.]*\)%.*/\1/')
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
          echo "React Native coverage: $PCT%"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          PCT="${{ steps.coverage.outputs.percentage }}"
          if (( $(echo "$PCT >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          printf '{"schemaVersion":1,"label":"react native coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > react-native/coverage-badge.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-native/coverage-badge.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update react native coverage badge [skip ci]"
            git stash --include-untracked || true
            git pull --rebase
            git stash pop || true
            git push
          fi

      - name: Build library
        run: yarn prepare
