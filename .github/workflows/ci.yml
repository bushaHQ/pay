name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      react-native: ${{ steps.filter.outputs.react-native }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'flutter/**'
              - 'shared/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'shared/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - 'shared/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            react-native:
              - 'react-native/**'
              - 'shared/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  flutter:
    name: Flutter
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Sync shared assets
        run: make sync
        working-directory: ${{ github.workspace }}

      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Android SDK not yet implemented — skipping."

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "iOS SDK not yet implemented — skipping."

  react-native:
    name: React Native
    needs: changes
    if: needs.changes.outputs.react-native == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: react-native/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Sync shared HTML
        working-directory: ${{ github.workspace }}
        run: make sync

      - name: Restore dependencies
        id: yarn-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: |
            react-native/**/node_modules
            react-native/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('react-native/yarn.lock') }}-${{ hashFiles('react-native/**/package.json', '!react-native/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ hashFiles('react-native/yarn.lock') }}
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Save dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: |
            react-native/**/node_modules
            react-native/.yarn/install-state.gz
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build library
        run: yarn prepare
