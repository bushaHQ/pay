name: Publish Flutter to pub.dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. flutter/v0.1.2)'
        required: true
        type: string

concurrency:
  group: publish-flutter-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout (tag ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Sync shared assets
        working-directory: ${{ github.workspace }}
        run: make sync-flutter

      - name: Install dependencies
        run: flutter pub get

      - name: Configure pub.dev OIDC auth
        uses: dart-lang/setup-dart@v1

      - name: Publish to pub.dev
        run: flutter pub publish --force
