name: busha_pay
description: Official Busha Pay SDK for Flutter. Accept crypto payments in your app with a single integration.
version: 0.1.0
homepage: https://github.com/bushaHQ/pay/tree/dev/flutter
repository: https://github.com/bushaHQ/pay
issue_tracker: https://github.com/bushaHQ/pay/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.1
  package_info_plus: ^10.1.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_inappwebview_platform_interface: ^1.3.0+1
  plugin_platform_interface: ^2.1.8

flutter:
  assets:
    - assets/busha_pay_checkout.html
    - assets/icons/busha.svg
    - assets/icons/busha-logo.svg
    - assets/icons/wallet-outline.svg
